services:
  archouse-learn:
    build: .
    container_name: archouse-learn
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Required when running behind Cloudflare Tunnel or any reverse proxy.
      # Tells Auth.js to trust the forwarded Host header rather than checking
      # it against NEXTAUTH_URL.
      AUTH_TRUST_HOST: "true"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://archouse-learn:3000
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - archouse-learn
